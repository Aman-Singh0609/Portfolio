<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#da291c">
    <title>Offside! | Aman Singh</title>
    <link rel="icon" href="https://aman-singh0609.github.io/Portfolio/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
            font-family:'Barlow',system-ui,sans-serif;color:#fff7f5;
            background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(218,41,28,.35),transparent 70%),#0a0506}
        .pitch{position:fixed;left:50%;top:50%;width:min(80vw,620px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.06);border-radius:50%;z-index:-1}
        .flag{font-size:3.4rem;animation:wave 1.4s ease-in-out infinite alternate;display:inline-block;transform-origin:bottom left}
        @keyframes wave{to{transform:rotate(14deg)}}
        h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(5rem,22vw,12rem);line-height:.9;letter-spacing:4px;
            background:linear-gradient(100deg,#ff3b2e,#fbe122);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:3px;margin:6px 0 12px}
        p{color:#c4aaa6;max-width:480px;margin:0 auto 30px}
        a{display:inline-block;padding:14px 38px;background:#da291c;color:#fff;text-decoration:none;font-weight:600;letter-spacing:2px;text-transform:uppercase;
            clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:.25s}
        a:hover{background:#ff3b2e;transform:translateY(-3px)}
        a:focus-visible{outline:3px solid #fbe122;outline-offset:3px}
    </style>
</head>
<body>
    <div class="pitch" aria-hidden="true"></div>
    <main>
        <div class="flag" aria-hidden="true">🚩</div>
        <h1>404</h1>
        <h2>Offside!</h2>
        <p>The page you're after isn't on the pitch. The linesman's flag is up. Let's get you back into play.</p>
        <a href="https://aman-singh0609.github.io/Portfolio/">Back to kick-off</a>
    </main>
</body>
</html>
